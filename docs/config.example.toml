# Copy to ~/.repopilot/config.toml (or REPOPILOT_HOME/config.toml), never auto-loaded from a repo.
[model]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"

[tests.python-unit]
kind = "pytest"
executable = 'D:\path\to\veritrail-agent\.venv\Scripts\python.exe'
args = ["-q"]
cwd = "."
timeout = 180

[tests.java-unit]
kind = "maven"
executable = 'D:\path\to\apache-maven\bin\mvn.cmd'
args = ["-q"]
cwd = "."
timeout = 180
