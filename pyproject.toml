[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "An auditable, approval-controlled coding agent for local repositories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16,<1",
    "rich>=14,<15",
    "pydantic>=2.11,<3",
    "filelock>=3.18,<4",
    "openai>=2,<3",
    "mcp>=2.3,<3",
    "jsonschema>=4,<5",
]

[project.scripts]
repopilot = "repopilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.hatch.build.targets.sdist]
exclude = ["/.eval-runs/**", "/.venv/**", "/dist/**"]
include = [
    "src/repopilot",
    "tests",
    "evals",
    "docs",
    ".github",
    "AGENTS.md",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    ".gitattributes",
    ".gitignore",
    ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/repopilot"]
